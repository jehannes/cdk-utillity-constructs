name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run linters
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build project
        run: npm run build

      - name: Determine version and compute release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_VERSION=$(gh release list --limit 1000 --json tagName --jq \
            '[.[] | .tagName | select(test("^v[0-9]+$")) | ltrimstr("v") | tonumber] | max // 0')

          NEXT_VERSION=$((CURRENT_VERSION + 1))
          TAG="v${NEXT_VERSION}"

          echo "NEXT_VERSION=${NEXT_VERSION}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "Computed tag: ${TAG}"

      - name: Package and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv cdk-utility-constructs-*.tgz "cdk-utility-constructs-${TAG}.tgz"

          REPO="${{ github.repository }}"
          COMMIT_SHA="${{ github.sha }}"

          BODY="## Release ${TAG}

          **Version:** \`${NEXT_VERSION}\`
          **Commit:** \`${COMMIT_SHA}\`

          ### Install

          **npm (direct download — recommended):**
          \`\`\`
          npm install https://github.com/${REPO}/releases/download/${TAG}/cdk-utility-constructs-${TAG}.tgz
          \`\`\`

          **npm (git tag — requires build toolchain):**
          \`\`\`
          npm install ${REPO}#${TAG}
          \`\`\`

          > **Note:** The git tag method requires the jsii build toolchain to be available locally, as npm will clone and build from source."

          gh release create "${TAG}" \
            "cdk-utility-constructs-${TAG}.tgz" \
            dist/js/*.tgz \
            dist/python/*.tar.gz \
            dist/python/*.whl \
            --title "Release ${TAG}" \
            --notes "${BODY}" \
            --latest \
            --target "${{ github.sha }}"
