name: Pull Request checking and beta build

on:
  pull_request:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run linters
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage enforcement
        run: npm run test:coverage

  build:
    runs-on: ubuntu-latest
    needs: [test,lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            *.tgz
            .jsii

  release:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: build-output
          path: ./

      - name: get package version name
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BRANCH="${{ github.head_ref }}"
          VERSION_NAME="v$VERSION-beta-$BRANCH"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "Branch: $BRANCH"
          echo "Version: $VERSION_NAME"

      - name: Create github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.event.pull_request.head.sha }}
          name: "Beta Release ${{ env.VERSION_NAME }}"
          body: >-
            Automated beta release from PR #${{ github.event.number }}
            **Source Branch:** `${{ github.head_ref }}`
            **Install using:** `npm install https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION_NAME }}/cdk-utility-constructs-0.0.1.tgz`
          prerelease: true
          files: |
            *.tgz
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # - name: Create npm release
      #   run: |
      #     npm version $VERSION_NAME
      #     npm publish --access public